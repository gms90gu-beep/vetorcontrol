name: Deploy isolated Vetor Control copy

on:
  push:
    branches: [copy-validation-20261012]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vetorcontrol-copy-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/copy-validation-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: https://ljlyvtwuikwuqcgrbkii.supabase.co
      VITE_SUPABASE_PROJECT_ID: ljlyvtwuikwuqcgrbkii
      VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxqbHl2dHd1aWt3dXFjZ3Jia2lpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4MjM0MDYsImV4cCI6MjEwNzM5OTQwNn0.zoBr9PhZKGMznkXOQozld2SMhjDNSS4POa5yhITJU_8
      CLOUDFLARE_API_TOKEN: ${{ secrets.VETOR_COPY_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.VETOR_COPY_CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check deployment secrets
        env:
          COPY_SERVER_KEY: ${{ secrets.VETOR_COPY_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node --input-type=module <<'NODE'
          const missing = ['CLOUDFLARE_API_TOKEN','CLOUDFLARE_ACCOUNT_ID','COPY_SERVER_KEY'].filter(k => !process.env[k]);
          if (missing.length) { console.error('Deployment blocked: missing secret values for ' + missing.join(', ')); process.exit(1); }
          const key = process.env.COPY_SERVER_KEY;
          if (!key.startsWith('sb_secret_')) {
            let claims;
            try { claims = JSON.parse(Buffer.from(key.split('.')[1], 'base64url').toString()); }
            catch { throw new Error('Invalid destination server key'); }
            if (claims.ref !== 'ljlyvtwuikwuqcgrbkii' || claims.role !== 'service_role') throw new Error('Server key is not for the external copy');
          }
          NODE
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile
      - run: node --test scripts/copy-backend.test.mjs scripts/platform-policy.test.mjs
      - run: npm run build
      - name: Verify isolated deployment artifact
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const config = JSON.parse(fs.readFileSync('.output/server/wrangler.json','utf8'));
          if (config.name !== 'vetorcontrol-copy-validation') throw new Error('Wrong Worker name');
          if (!fs.existsSync('.output/public/sw.js')) throw new Error('Missing service worker');
          function inspect(dir) {
            for (const entry of fs.readdirSync(dir,{withFileTypes:true})) {
              const file = path.join(dir,entry.name);
              if (entry.isDirectory()) inspect(file);
              else if (/\.(js|mjs|json)$/.test(file) && fs.readFileSync(file,'utf8').includes('ttjzgszxrnmcsygtzfcu')) throw new Error('Production backend reference found');
            }
          }
          inspect('.output');
          NODE
      - name: Register test hosting address if account has none
        run: |
          node --input-type=module <<'NODE'
          const endpoint = 'https://api.cloudflare.com/client/v4/accounts/' + process.env.CLOUDFLARE_ACCOUNT_ID + '/workers/subdomain';
          const headers = {Authorization:'Bearer ' + process.env.CLOUDFLARE_API_TOKEN, 'Content-Type':'application/json'};
          const response = await fetch(endpoint,{headers});
          const current = await response.json();
          if (response.ok && current.success && current.result?.subdomain) {
            console.log('Existing workers.dev subdomain preserved: ' + current.result.subdomain);
          } else if (response.status === 404) {
            const created = await fetch(endpoint,{method:'PUT',headers,body:JSON.stringify({subdomain:'vetorcontrol-reserva-gms90gu'})});
            const result = await created.json();
            if (!created.ok || !result.success) throw new Error('Could not register test address; HTTP ' + created.status + '; codes ' + (result.errors || []).map(x=>x.code).join(','));
            console.log('Registered workers.dev subdomain: ' + result.result.subdomain);
          } else {
            throw new Error('Could not check account subdomain; HTTP ' + response.status + '; codes ' + (current.errors || []).map(x=>x.code).join(','));
          }
          NODE
      - name: Deploy Worker and server secret together
        env:
          COPY_SERVER_KEY: ${{ secrets.VETOR_COPY_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          secret_file="$RUNNER_TEMP/vetor-copy-secrets.json"
          export COPY_SECRETS_FILE="$secret_file"
          trap 'rm -f "$secret_file"' EXIT
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          fs.writeFileSync(process.env.COPY_SECRETS_FILE, JSON.stringify({SUPABASE_SERVICE_ROLE_KEY:process.env.COPY_SERVER_KEY}),{mode:0o600});
          NODE
          npx --no-install wrangler deploy --config .output/server/wrangler.json --name vetorcontrol-copy-validation --secrets-file "$secret_file"

      - name: Check deployed home and service worker
        run: |
          node --input-type=module <<'NODE'
          const endpoint = 'https://api.cloudflare.com/client/v4/accounts/' + process.env.CLOUDFLARE_ACCOUNT_ID + '/workers/subdomain';
          const metadata = await fetch(endpoint,{headers:{Authorization:'Bearer ' + process.env.CLOUDFLARE_API_TOKEN}}).then(r=>r.json());
          if (!metadata.success || !metadata.result?.subdomain) throw new Error('Cannot resolve deployed address');
          const base = 'https://vetorcontrol-copy-validation.' + metadata.result.subdomain + '.workers.dev';
          for (const path of ['/', '/sw.js']) {
            let passed = false;
            for (let attempt=1;attempt<=6;attempt++) {
              try {
                const response = await fetch(base + path,{signal:AbortSignal.timeout(15000)});
                const body = await response.text();
                if (response.ok && (path==='/' ? body.includes('<html') : body.length > 100)) {
                  console.log('Verified ' + base + path + ' HTTP ' + response.status);
                  passed = true; break;
                }
                console.log('Endpoint pending: ' + path + ' HTTP ' + response.status);
              } catch { console.log('Endpoint pending: ' + path + ' connection not ready'); }
              if (attempt<6) await new Promise(r=>setTimeout(r,10000));
            }
            if (!passed) throw new Error('Deployed endpoint check failed: ' + path);
          }
          NODE
